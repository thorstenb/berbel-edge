[tox]
skipsdist = true
envlist = lint, py313

[gh-actions]
python =
    3.13: py313

[testenv]
passenv = PYTHON_VERSION
deps =
    pytest
    ruff
    bleak
    bleak_retry_connector
    pytest-homeassistant-custom-component
    aiousbwatcher
    pyserial
    habluetooth==6.1.0
    bluetooth-auto-recovery==1.6.4
    bluetooth-data-tools==1.28.4
setenv =
  LC_ALL=C.UTF-8
ignore_errors = true
commands =
    pytest

[testenv:lint]
skip_install = true
commands =
    ruff check custom_components tests
